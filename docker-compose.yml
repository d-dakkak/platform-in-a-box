# Local development stack: docker compose up --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["15672:15672"]   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  orders-api:
    build: ./apps/orders-api
    ports: ["8080:8080"]
    environment: &app-env
      DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on: &deps
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}

  inventory-worker:
    build: ./apps/inventory-worker
    environment: *app-env
    depends_on: *deps

  notifier:
    build: ./apps/notifier
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq: {condition: service_healthy}
