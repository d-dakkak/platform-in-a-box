{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  {{- if not ((default dict $svc.autoscaling).enabled) }}
  replicas: {{ $svc.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/part-of: shop
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "shop.labels" $ | nindent 8 }}
    spec:
      serviceAccountName: shop
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: {{ $name }}
          image: {{ include "shop.image" (list $ $svc) | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: {{ $svc.port }}}
          env:
            {{- range $svc.secretKeys }}
            - name: {{ . }}
              valueFrom:
                secretKeyRef: {name: shop-secrets, key: {{ . }}}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - {name: {{ $k }}, value: {{ $v | quote }}}
            {{- end }}
          {{- if $svc.probes }}
          livenessProbe:
            httpGet: {path: {{ $svc.probes.liveness }}, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: {{ $svc.probes.readiness }}, port: http}
            periodSeconds: 5
          {{- else }}
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
{{- end }}
