{{- range $name, $svc := .Values.services }}
{{- if $svc.expose }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "shop.labels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/part-of: shop
  ports:
    - {name: http, port: {{ $svc.port }}, targetPort: http}
{{- end }}
{{- end }}
