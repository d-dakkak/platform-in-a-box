{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shop-secrets
  labels:
    {{- include "shop.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: shop-secrets
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{`{{ .pgpass }}`}}"
        RABBITMQ_PASSWORD: "{{`{{ .rmqpass }}`}}"
        DATABASE_URL: "postgresql://shop:{{`{{ .pgpass }}`}}@postgres:5432/shop"
        AMQP_URL: "amqp://shop:{{`{{ .rmqpass }}`}}@rabbitmq:5672/"
  data:
    - secretKey: pgpass
      remoteRef: {key: {{ .Values.externalSecrets.postgresKey }}}
    - secretKey: rmqpass
      remoteRef: {key: {{ .Values.externalSecrets.rabbitmqKey }}}
{{- else if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: shop-secrets
  labels:
    {{- include "shop.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://shop:%s@postgres:5432/shop" .Values.secrets.postgresPassword | quote }}
  AMQP_URL: {{ printf "amqp://shop:%s@rabbitmq:5672/" .Values.secrets.rabbitmqPassword | quote }}
{{- end }}
