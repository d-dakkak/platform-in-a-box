installCRDs: true
serviceAccount:
  create: true
  name: external-secrets            # must match the federated credential subject in Terraform
  annotations:
    azure.workload.identity/client-id: __ESO_CLIENT_ID__
    azure.workload.identity/tenant-id: __TENANT_ID__
podLabels:
  azure.workload.identity/use: "true"
resources:
  requests: {cpu: 25m, memory: 64Mi}
  limits: {cpu: 200m, memory: 192Mi}
