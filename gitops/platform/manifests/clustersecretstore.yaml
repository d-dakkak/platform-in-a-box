# Key Vault access through AKS workload identity (no credentials stored in the cluster).
# Uses apiVersion external-secrets.io/v1; on older operator versions use v1beta1.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-keyvault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: __KEYVAULT_URI__
      serviceAccountRef:
        name: external-secrets
        namespace: external-secrets
